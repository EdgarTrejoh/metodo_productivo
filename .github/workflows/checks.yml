name: Django checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: postgresql
      PGDATABASE: metodo_productivo_ci
      PGUSER: ci_user
      PGPASSWORD: ci-only-password
      PGHOST: localhost
      PGPORT: '5432'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: metodo_productivo_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d metodo_productivo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Concurrencia de descargas obligatoria en PostgreSQL
        run: |
          set -euo pipefail
          python manage.py shell -c "from django.db import connection; assert connection.vendor == 'postgresql', 'Las pruebas concurrentes requieren PostgreSQL'"
          output=$(python manage.py test leads.test_lead_magnet.ConcurrentAccessTests 2>&1)
          printf '%s\n' "$output"
          grep -Fq 'Ran 2 tests' <<< "$output"
          grep -Fxq 'OK' <<< "$output"
      - run: python manage.py test leads.test_lead_magnet
      - run: python manage.py test store.tests
      - run: python manage.py test content.tests
      - run: python manage.py test
