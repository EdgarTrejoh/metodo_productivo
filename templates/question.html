{% extends 'base.html' %}{% block content %}<p class="eyebrow">Pregunta {{ number }} de 8</p><progress value="{{ number }}" max="8" aria-label="Avance del cuestionario"></progress><form method="post">{% csrf_token %}<input type="hidden" name="execution" value="{{ execution }}"><fieldset><legend>{{ form.answer.label }}</legend>{{ form.answer.errors }}{{ form.answer }}</fieldset><div class="actions">{% if previous %}<a href="{% url 'question' previous %}">Anterior</a>{% endif %}<button>{% if number == 8 %}Terminar cuestionario{% else %}Continuar{% endif %}</button></div></form>{% endblock %}
